# GitHub Pages 배포 — index.html 만 올린다 (레거시 Jekyll 빌더는 원인 없이 실패한 적이 있어 Actions 로 배포. cloudx-foundation 과 같은 방식)
# 저장소 설정의 Pages 소스는 "GitHub Actions" 여야 한다: gh api -X PUT repos/osstemswai/pms-figma-links/pages -f build_type=workflow
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp index.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
